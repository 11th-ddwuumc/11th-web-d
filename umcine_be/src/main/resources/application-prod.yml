server:
  address: 0.0.0.0
  port: 8080
cors:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/umcine
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 데이터는 앱 시작 시 자동 변경하지 않아요.
